<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Crud APP Basics</title>
</head>
<body>
    <h1 class="crud-app-title">CRUD Fundementals</h1>
    <div class="container">

        <div class="section-left">
            <form action="" id="form">
                <label for="name">Write your post here:</label>
                <br>
                <textarea name="" id="" cols="30" rows="10"></textarea>
                <br>
                <button type="submit">Post</button>
            </form>
        </div>

        <div class="section-right">
            <h3 class="post-here">Your Posts Here</h3>
            <div class="posts">
                <div class="post-1">Post-1</div>
                <div class="post-2">Post-2</div>
            </div>
        </div>

    </div>
    <script src="./script.js"></script>
</body>


</html>

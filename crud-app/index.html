<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/d42b284ab2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./style.css">

    <title>Crud APP</title>
</head>
<body>
    <h1 class="crud-app-title">CRUD Fundementals</h1>
    <div class="container">

        <div class="section-left">
            <form action="" id="form">
                <label for="name">Write your post here:</label>
                <br>
                <textarea name="" id="input" cols="30" rows="10"></textarea>
                <br>
                <button class="submit-post-btn" type="submit">Post</button>
            </form>
        </div>

        <div class="section-right">
            <h3 class="post-here">Your Posts Here</h3>
            <div class="posts">
                <div class="post-1 post-list-item">
                    <p>Post 1</p>
                    <span class="post-btns">
                        <p class="edit-o post-btn">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </p>
                        <p class="delete-x post-btn">
                            <i class="fa-solid fa-check"></i>
                        </p>
                    </span>
                </div>
                <div class="post-2 post-list-item">
                    <p>Post 2</p>
                    <span class="post-btns">
                        <p class="edit-o post-btn">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </p>
                        <p class="delete-x post-btn">
                            <i class="fa-solid fa-check"></i>
                        </p>
                    </span>
                </div>
            </div>
        </div>

    </div>
    <script src="./script.js"></script>
</body>


</html>

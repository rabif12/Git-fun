<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Tasker App</title>
</head>
<body>
  <div class="navigation-menu">
    <nav>
      <a class="project-page-link" href="../index.html">&lt;=project page</a>
    </nav>
  </div>
  <div class="main-container">
    <div class="input-container">
      <div class="input-title-wrapper">
        <h4 class="input-title">Tasker</h4>
        <div class="input-wrapper">
          <input class="input-text input-item" type="text" id="amount-input" placeholder="Title" required>
          <input class="input-text input-item" type="date" id="amount-input" required>
          <textarea class="display-text-area input-item" name="input-info" id="input-text-area" rows="4" placeholder="Description..."></textarea>
          <button class="input-btn input-item">Enter</button>
        </div>
      </div>
    </div>
    <div class="display-container">
      <h4 class="result-title">Tasks:</h4>
      <div class="task-list">
        <div class="task-block">
          <h4 class="task-title task-item">Task 1</h4>
          <p class="task-date task-item">11/04/2026</p>
          <p class="task-info task-item">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Error quo quis nulla fuga, minima consectetur rem laudantium ex. Deleniti sapiente perferendis minus, repellat magni optio possimus nobis laboriosam cum ipsum.</p>
          <div class="task-btn-wrapper">
            <button class="complete-btn task-item">Complete</button>
            <button class="delete-btn task-item">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>






  <script src="./script.js"></script>
</body>
</html>

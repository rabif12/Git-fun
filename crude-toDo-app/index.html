<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>To Do App</title>
</head>
<body>
    <div class="container-app">
        <h4>Todo App</h4>
        <div class="addNew">
            <span>Add New Task</span>
            <p class="plus-btn">+</p>
        </div>
        <h5>Tasks</h5>
    </div>

    <div class="modal-layer ">
        <div class="container-modal">
            <div class="modal">
                <h5 class="modal-title">Title</h5>
                <input class="modal-title-input modal-input" type="text">
                <h5 class="modal-date ">Due Date</h5>
                <input class="modal-date-input modal-input" type="date" name="" id="">
                <h5 class="modal-info">Info</h5>
                <textarea class="modal-info-input modal-input" rows="12"></textarea>
                <button class="update-btn">Post</button>
            </div>
        </div>
    </div>
    


    <script src="./script.js"></script>
</body>
</html>

<html>

  <body>
    <script src="./react-script.js"></script>
    <div class="js-container"></div>

                    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Debitis error ea magnam consequatur, quibusdam voluptatum maxime doloremque earum neque enim, cupiditate maiores expedita minima repellat perspiciatis, consectetur molestias eos! Necessitatibus! {2+2}</p>

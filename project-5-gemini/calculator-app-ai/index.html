<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Calculator</title>
</head>
<body>

    <div class="main-container">

        <div class="calculator-app">

            <div class="calc-app-container">

                

                <div class="calc-app-btns">
                    
                    <div class="calc-app-display">
                        <div class="calc-display-text"></div>
                    </div>

                    <div class="calc-app-clear-btn calc-app-big-btn">Clear</div>

                    <div class="calc-app-7-btn calc-app-small-btn">7</div>
                    <div class="calc-app-8-btn calc-app-small-btn">8</div>
                    <div class="calc-app-9-btn calc-app-small-btn">9</div>
                    <div class="calc-app-divide-btn calc-app-small-btn">/</div>

                    <div class="calc-app-4-btn calc-app-small-btn">4</div>
                    <div class="calc-app-5-btn calc-app-small-btn">5</div>
                    <div class="calc-app-6-btn calc-app-small-btn">6</div>
                    <div class="calc-app-multiply-btn calc-app-small-btn">*</div>

                    <div class="calc-app-1-btn calc-app-small-btn">1</div>
                    <div class="calc-app-2-btn calc-app-small-btn">2</div>
                    <div class="calc-app-3-btn calc-app-small-btn">3</div>
                    <div class="calc-app-subtracts-btn calc-app-small-btn">-</div>

                    <div class="calc-app-0-btn calc-app-small-btn">0</div>
                    <div class="calc-app-period-btn calc-app-small-btn">.</div>
                    <div class="calc-app-equals-btn calc-app-small-btn">=</div>
                    <div class="calc-app-add-btn calc-app-small-btn">+</div>

                </div>
            </div>

        </div>

    </div>







    <script src="./script.js"></script>
</body>
</html>

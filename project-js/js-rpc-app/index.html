<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Rock Paper Scissors</title>
</head>
<body>

  <div class="navigation-menu">
      <nav>
        <a class="project-page-link" href="../index.html">&lt;=project page</a>
      </nav>
  </div>

  <div class="main-container">
    

    <div class="score-board-container">

      <div class="main-title">

        <h3 class="main-title-h3">Rock Paper Scissors</h3>

      </div>

      <div class="score-board">
        <div class="my-score-title score-title">You</div>
        <div class="your-score scores">0</div>
        <div class="middle-spacer">|</div>
        <div class="computer-score-title score-title">Computer-AI</div>
        <div class="computer-score scores">0</div>

      </div>

    </div>

    <div class="display-title-wrapper">
      <div class="displa-title">
        <h3>Man VS Machine</h3>
        <h3>Who Will Win</h3>
      </div>
    </div>

    <!-- this is the display section -->
    <div class="display-container">

      <div class="your-result-img-left">
        <div class="result-left-wrapper">
          <img class="rock-img result-left" src="./img/rock-img-Photoroom.png" alt="">
        </div>
      </div>

      <div class="computer-result-img-right">
        <div class="result-left-wrapper">
          <img class="paper-img result-right" src="./img/paper-img-Photoroom.png" alt="">
        </div>
      </div>

    </div>

    <!-- this is the button section -->
    <div class="button-container">

      <div class="rock-button-left img-wrapper"><img class="rock-img" src="./img/rock-img-Photoroom.png" alt=""></div>

      <div class="paper-button-middle img-wrapper">
        <img class="paper-img" src="./img/paper-img-Photoroom-Photoroom.png" alt="">
      </div>

      <div class="scissor-button-right img-wrapper">
        <img src="./img/scissor-img-Photoroom.png" class="scissor-img" alt="">
      </div>

    </div>

  </div>
</body>
</html>
